<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>CopyCLI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<aside id="side">
  <div class="drag"></div>
  <div class="brand"><span class="brand-mark" data-icon="layers"></span>CopyCLI<span id="app-version" class="brand-meta"></span></div>
  <button id="new" class="wide" title="New chat (⌘N)"><span data-icon="plus"></span>New chat<kbd>⌘N</kbd></button>
  <div class="sidebar-label">Conversations<span id="chat-count"></span></div>
  <nav id="chats" aria-label="Chats"></nav>
  <button id="settings-btn" class="wide quiet" title="Settings (⌘,)"><span data-icon="settings"></span>Settings<kbd>⌘,</kbd></button>
  <div class="sidebar-footer"><span class="dot"></span>Your workspace, connected</div>
</aside>
<main id="main">
  <header id="top"><input id="title" aria-label="Chat title" spellcheck="false"><button id="folder" class="quiet" title="Change folder"></button><span class="grow"></span><button id="browser-btn" class="quiet" title="Show or hide the browser (⌘B)" aria-expanded="false" aria-controls="web"><span data-icon="panel"></span>Browser</button></header>
  <section id="log" aria-live="polite"></section>
  <section id="approvals" aria-label="Approvals"></section>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="What would you like to build? Use @ to mention an agent." aria-label="Message your agents"></textarea>
    <div id="mentions" hidden></div>
    <div id="models"></div>
    <div class="row"><div id="targets" role="group" aria-label="Send to"></div><span class="grow"></span>
      <select id="mode" aria-label="Permissions"><option value="plan">Plan only</option><option value="ask">Ask first</option><option value="edit">Edit files freely</option><option value="full">Full access</option></select>
      <button id="stop" type="button" class="quiet" hidden>Stop all</button><button id="send" class="primary" title="Send message">Send<span data-icon="arrow-up"></span></button></div>
  </form>
  <div id="composer-hint" class="composer-hint" hidden><span id="send-hint">Enter to send</span><span>·</span><span>Shift + Enter for a new line</span></div>
</main>
<div id="grip" role="separator" aria-label="Resize browser" hidden></div>
<section id="web" hidden aria-label="Browser">
  <div id="tabs"></div>
  <div id="bar"><button data-nav="back" aria-label="Back">←</button><button data-nav="forward" aria-label="Forward">→</button><button data-nav="reload" aria-label="Reload">↻</button><input id="url" placeholder="Search or enter address" spellcheck="false"><select id="share" aria-label="Hand this tab to an agent"></select></div>
  <div id="view"><p>Open a page here, or let an agent do it.</p></div>
</section>
<section id="settings" role="region" aria-label="Settings" hidden></section>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
